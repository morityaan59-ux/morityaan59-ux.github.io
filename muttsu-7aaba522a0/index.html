<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>むっつ予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* くじ購入画面風: 白い画面・赤の強調・クリーム色の数字パネル・灰色の四角い数字ボタン。左にA〜Y・AA〜AYの申込枠（5枠ずつ表示）、右（スマホでは下）に数字パネル */
  --bg:#F3F3F3; --surface:#FFFFFF; --ink:#222222; --muted:#6B6B6B; --line:#DDDDDD;
  --red:#D7000F; --red-soft:#FDECEC; --cream:#FFF9E3; --tile:#E9E9E9; --self:#0A8FD8; --rand:#5B9E1A; --orange:#E66B00; --gold:#E8B21E;
  --sheet:var(--red); --accent:var(--red); --accent-ink:#B0000C; --accent-soft:var(--red-soft); --good:#0A8FD8; --good-soft:#E3F2FB; --pencil:#333;
  --font-display:"Noto Sans JP",system-ui,sans-serif;
  --font-body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --font-num:"Roboto","Noto Sans JP",system-ui,sans-serif;
  --r:6px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px calc(118px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;letter-spacing:.01em;line-height:1.2}
h1 small{display:block;font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;color:var(--muted);margin:0;letter-spacing:.04em}
.pts{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pts span{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.next{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.next b{color:var(--ink);font-weight:700}
.view{display:none;flex-direction:column;gap:16px}
.view.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ball{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:500;font-variant-numeric:tabular-nums;font-size:15px;cursor:pointer;transition:transform .08s,background .12s;padding:0;min-width:0}
.ball:active{transform:scale(.92)}
.ball.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ball:disabled{opacity:.35;cursor:default}
.picked{display:flex;gap:6px;min-height:40px;align-items:center}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;border:1.5px dashed var(--line);color:var(--muted);flex:none}
.mini.f{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.mini.hit{background:var(--accent);border-color:var(--accent);color:#fff;border-style:solid}
.mini.bon{border:1.5px solid var(--good);color:var(--good);border-style:solid;background:var(--good-soft)}
.mini.plain{border:1.5px solid var(--line);color:var(--ink);border-style:solid}
.mini.sm{width:30px;height:30px;font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.btn.wide{flex:1}
.btn.small{min-height:34px;padding:4px 10px;font-size:13px}
.btn:focus-visible,.ball:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.ticket{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ticket:first-child{border-top:0}
.ticket .nums{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.win{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.wait{background:var(--good-soft);color:var(--good);border-color:transparent}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
td.em{font-weight:700}
.tag{font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.tile b{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:11.5px;color:var(--muted)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select,input[type=number],input[type=date],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6}
.latest{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.latest .plus{color:var(--muted);font-size:13px;margin:0 2px}
.drawrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.drawrow .meta{width:86px;flex:none;font-variant-numeric:tabular-nums}
.drawrow .meta b{display:block;font-size:14px}
.drawrow .nums{display:flex;gap:4px;flex-wrap:wrap}
.inputs7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.inputs7 input{padding:8px 2px;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);z-index:5}
.tabs .disc{text-align:center;font-size:10.5px;color:var(--muted);padding:4px 8px 0}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:6px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;min-height:54px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:12px 0}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hint-ok{color:var(--good);font-weight:700}

/* ---- 購入画面風 ---- */
header{background:var(--surface);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;align-items:center;border-bottom:3px solid var(--red)}
h1{font-weight:700;font-size:22px;letter-spacing:.02em}
h1 small{color:var(--red);font-weight:700}
h2{font-family:var(--font-body);font-weight:700;font-size:18px}
.pts{font-family:var(--font-num)}
.next{padding:10px 0;margin-bottom:12px}
.next b{font-family:var(--font-num)}
.card{border-radius:var(--r)}
.buyhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.buyhead h2{font-size:19px}
.buyhead .d{font-size:13.5px;color:var(--ink)}
.lead{font-size:13.5px;margin:0}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:stretch;border:1px solid #CFCFCF;border-radius:5px;background:var(--surface);cursor:pointer;min-height:52px;overflow:hidden;padding:0}
.line .lab{width:28px;flex:none;display:grid;place-items:center;background:#D5D5D5;color:#333;font-weight:700;font-size:14px}
.line .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 8px}
.line .dots{display:flex;gap:5px}
.line .dot{width:30px;height:30px;border-radius:50%;background:#CDCDCD;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-num);font-size:14px}
.line .dot.self{background:var(--self)}
.line .dot.rand{background:var(--rand)}
.line .x{width:30px;flex:none;display:grid;place-items:center;background:#D5D5D5;color:#fff;font-size:20px;border:0;cursor:pointer}
.line.on{border-color:var(--red);background:var(--cream)}
.line.on .lab{background:var(--red);color:#fff}
.line.on .x{background:#BDBDBD}
.line .sub{font-size:11px;color:var(--muted)}
.line .sub b{background:#E4E4E4;padding:0 6px;border-radius:2px;color:var(--ink);font-weight:700;margin-left:2px}
.panel{background:var(--cream);border:1px solid var(--red);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pnav{display:flex;justify-content:center;align-items:center;gap:14px;font-weight:700}
.pnav button{width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.pnav button:disabled{background:#CFCFCF;cursor:default}
.grid{grid-template-columns:repeat(7,1fr);gap:5px}
.ball{aspect-ratio:1/0.92;border-radius:3px;border:1px solid #D3D3D3;background:var(--tile);color:#222;font-family:var(--font-num);font-weight:700;font-size:16px;height:auto}
.ball.on{background:var(--self);border-color:var(--self);color:#fff;background-image:none}
.ball.on.rand{background:var(--rand);border-color:var(--rand)}
.ball:disabled{opacity:.45}
.remain{text-align:right;font-weight:700;font-size:14px}
.remain b{font-size:18px}
.legend{display:flex;gap:12px;font-size:12.5px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:2px;margin-right:4px;vertical-align:-2px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border-radius:4px}
.btn.green{background:var(--rand);border-color:var(--rand);color:#fff;font-weight:700}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.btn.gray{background:linear-gradient(#EFEFEF,#D9D9D9);border-color:#C9C9C9;font-weight:700}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.primary:disabled{background:#CFCFCF;border-color:#CFCFCF;opacity:1}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:10px;font-size:13.5px;font-weight:700;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.total .sum{color:var(--red);font-size:26px;font-family:var(--font-num)}
.total .sum small{font-size:14px}
.mini{font-family:var(--font-num)}
.mini.hit,.latest .mini{border:0;color:#fff;background:var(--red)}
.mini.bon{border:0;color:#fff;background:var(--orange)}
.latest .mini{width:40px;height:40px;font-size:16px}
.latest .plus{font-weight:700;color:var(--orange)}
.mini.plain{border:0;background:#E4E4E4;color:var(--ink)}
.ticket{gap:10px}
.ticket .mini.sm{width:28px;height:28px}
.pill.win{background:var(--red);border-color:var(--red)}
.tile b{font-family:var(--font-num);font-weight:700}
th{background:#F0F0F0;color:#444;font-weight:700}
.tabs{border-top:1px solid var(--line)}
.tab.on{color:var(--red)}
.note{border-left:3px solid var(--red);border-radius:2px}
.tierrules td{font-size:13px}
.admin{border:1px solid var(--red)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;flex-wrap:wrap;padding-top:2px}
.pgb{width:30px;height:30px;border-radius:50%;border:0;background:#C9C9C9;color:#fff;font-weight:700;cursor:pointer;padding:0}
.pgb:not(:disabled){background:#9A9A9A}
.pgb:disabled{opacity:.5;cursor:default}
.aline{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.aline:first-child{border-top:0}
.aline .lab{width:24px;height:24px;flex:none;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:700;border-radius:3px;font-size:13px}
.aline .info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.aline .rule{font-size:11.5px;color:var(--muted);line-height:1.4}
.aline .nums{display:flex;gap:4px;flex-wrap:wrap}
.tierrules td:nth-child(2),.tierrules th:nth-child(2){text-align:left}
.gsw{display:flex;margin:8px 0 0;border-bottom:2px solid var(--red)}
.gbtn{flex:1;appearance:none;border:1px solid var(--line,#ddd);border-bottom:0;background:#fff;color:var(--red);font-weight:700;font-size:15px;padding:9px 0;cursor:pointer;border-radius:8px 8px 0 0}
.gbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.ainfo{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.arow{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.alab{font-size:12px;color:var(--muted);font-weight:700}
.arow .nums{display:flex;gap:4px;flex-wrap:wrap}
.line .dots.seven{gap:3px}
.line .dots.seven .dot{width:26px;height:26px;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><small>ロト6・ロト7シミュレーション</small>むっつ予想</h1>
    <div class="pts" id="pts" aria-live="polite">0<span>pt</span></div>
  </header>
  <div class="gsw" role="tablist" aria-label="くじの種類">
    <button class="gbtn on" role="tab" data-g="6">ロト6</button>
    <button class="gbtn" role="tab" data-g="7">ロト7</button>
  </div>
  <div class="next" id="nextLine">読み込み中…</div>

  <!-- 予想する -->
  <section class="view on" id="v-pick" aria-label="予想する">
    <div class="card">
      <div class="buyhead"><h2 id="pickTitle">ロト6</h2><span class="d" id="pickDate"></span></div>
      <p class="lead" id="pickLead"></p>
      <div class="lines" id="lines"></div>
      <div class="panel">
        <div class="pnav"><button id="prevLine" aria-label="前の枠">‹</button><span id="curLab">A</span><button id="nextLineBtn" aria-label="次の枠">›</button></div>
        <div class="grid" id="grid"></div>
        <div class="remain" id="pickCount"></div>
        <div class="row spread"><div class="legend"><span><i style="background:var(--self)"></i>自分で選択</span><span><i style="background:var(--rand)"></i>ランダム選択</span></div><button class="btn gray small" id="btnClear">リセット</button></div>
        <div class="pbtns"><button class="btn green" id="btnRand">ランダム選択</button><button class="btn orange" id="btnQuick">クイックピック</button></div>
        <p class="muted" style="margin:0;font-size:12px" id="randNote"></p>
      </div>
      <div class="total"><span id="costLabel"></span><span>登録口数 <span id="lineCount">0</span>口</span><span>合計 <span class="sum" id="sumPt">0<small>pt</small></span></span></div>
      <button class="btn primary" id="btnBuy" disabled>予想を登録する</button>
    </div>
    <div class="card admin">
      <div class="row spread"><h2 id="adminTitle">管理人の予想</h2><span class="tag" id="adminSrc"></span></div>
      <p class="muted" style="margin:0" id="adminLead"></p>
      <div class="row" style="flex-wrap:nowrap">
        <label for="adminFmt" style="flex:1">買い方の型
          <select id="adminFmt"></select></label>
        <label for="adminCount" style="width:96px">口数
          <select id="adminCount"><option>5</option><option>10</option><option>20</option><option>30</option><option>50</option></select></label>
      </div>
      <div id="adminInfo" class="ainfo"></div>
      <div id="adminLines"></div>
      <button class="btn primary" id="btnAdmin">この予想を枠に入れる</button>
      <div id="adminRecord" class="note"></div>
    </div>
    <div class="card">
      <div class="row spread"><h3>登録した予想</h3><span class="muted" id="openInfo"></span></div>
      <div id="openList"></div>
    </div>
    <p class="note" id="pickNote"></p>
  </section>

  <!-- 過去で試す -->
  <section class="view" id="v-test" aria-label="過去で試す">
    <div class="card">
      <h2 id="testTitle">選び方を過去の回で試す</h2>
      <label for="strat">選び方
        <select id="strat">
          <option value="random">毎回おまかせ（ランダム）</option>
          <option value="birthday">誕生日の数字だけ（1〜31）</option>
          <option value="avoidPrev">前回の数字を外す</option>
          <option value="pullPrev1">前回の数字を1個入れる</option>
          <option value="pullPrev2">前回の数字を2個入れる</option>
          <option value="hot">直近24回でよく出た数字から</option>
          <option value="cold">直近24回であまり出ていない数字から</option>
          <option value="fixed">いつも同じ数字</option>
          <option value="admin">管理人の予想（いま選んでいる型）</option>
        </select>
      </label>
      <div id="fixedBox" style="display:none" class="row">
        <label for="fixedNums" style="flex:1" id="fixedLabel">いつも使う数字（カンマ区切り）
          <input type="text" id="fixedNums" inputmode="numeric">
        </label>
      </div>
      <div id="condBox">
        <h3 style="margin-bottom:4px">追加の条件</h3>
        <label class="check"><input type="checkbox" id="cConsec">連続する数字は1組まで</label>
        <label class="check"><input type="checkbox" id="cDigit">下1桁が同じペアを1組以上入れる</label>
        <label class="check"><input type="checkbox" id="cOdd"><span id="oddLabel">奇数と偶数を半分ずつにする</span></label>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <label for="range" style="flex:1">試す範囲
          <select id="range">
            <option value="all">全部の回</option>
            <option value="500">直近500回</option>
            <option value="100">直近100回</option>
          </select>
        </label>
        <label for="perRound" style="width:96px">1回あたり
          <select id="perRound"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option><option>20</option><option>50</option></select>
        </label>
        <label for="seed" style="width:96px">乱数の種
          <input type="number" id="seed" inputmode="numeric">
        </label>
      </div>
      <button class="btn primary" id="btnRun">この選び方で試す</button>
    </div>
    <div class="card" id="testOut"><p class="empty">選び方を決めて「この選び方で試す」を押すと、何等が何回出たかがここに出ます。</p></div>
  </section>

  <!-- 成績 -->
  <section class="view" id="v-stats" aria-label="成績">
    <div class="card">
      <h2 id="statsTitle">あなたの成績</h2>
      <div class="tiles" id="tiles"></div>
      <table id="tierTable"></table>
      <div class="row spread"><span class="muted" id="syncNote"></span><button class="btn small" id="btnRefill">ポイントを補充</button></div>
    </div>
    <div class="card">
      <h3>答え合わせ済みの予想</h3>
      <div id="doneList"></div>

/* ---------- 乱数・小道具 ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function combos(arr,k){ const out=[]; const rec=(s,acc)=>{ if(acc.length===k){ out.push(acc.slice()); return; } for(let i=s;i<arr.length;i++){ acc.push(arr[i]); rec(i+1,acc); acc.pop(); } }; rec(0,[]); return out; }

/* ---------- 統計の下ごしらえ ---------- */
function stats(g, r, win=24){
  const D=g.DRAWS, cnt=new Array(g.max+1).fill(0), last=new Array(g.max+1).fill(0);
  for(let k=r-win;k<r;k++){ const d=D.get(k); if(d) d.nums.forEach(x=>cnt[x]++); }
  let left=g.max; for(let k=r-1;k>=1&&left>0;k--){ const d=D.get(k); if(d) d.nums.forEach(x=>{ if(!last[x]){ last[x]=k; left--; } }); }
  return {cnt,last,prev:D.get(r-1),p2:D.get(r-2),p3:D.get(r-3)};
}

/* ---------- 管理人の予想 ---------- */
/* ロト6：添付資料「ロト6 確率の設計図」の絞り込み（ファネル）と買い方の型をそのまま機械的に当てはめる */
const WARI = [[4.9,7.1,3.5],[3.9,7.3,2.8],[3.0,2.7,3.6],[3.4,2.5,2.9],[2.6,2.9,3.1],[2.5,2.9,3.7]];
function funnel6(r){
  const g=GAMES["6"], st=stats(g,r), rng=mulberry32(r*104729+3);
  const P=st.prev.nums;
  const sweet=g.range.filter(n=>st.cnt[n]>=3&&st.cnt[n]<=4);              // Filter1: 過去24回で3〜4回
  const W=new Set();                                                          // Filter2: 割値（過去3回の位置ごとの合計÷割値）
  if(st.p3) for(let k=0;k<6;k++){ const S=st.prev.nums[k]+st.p2.nums[k]+st.p3.nums[k]; for(const dv of WARI[k]){ const v=Math.round(S/dv); if(v>=1&&v<=43) W.add(v); } }
  const slide=new Set(); P.forEach(n=>{ [n-1,n+1].forEach(x=>{ if(x>=1&&x<=43&&!P.includes(x)) slide.add(x); }); });
  const score=n=> (sweet.includes(n)?2:0)+(W.has(n)?2:0)+(P.includes(n)?1:0)+(slide.has(n)?1:0)+rng()*0.01;
  const ranked=g.range.slice().sort((a,b)=>score(b)-score(a));
  const core=sortN(ranked.slice(0,10));                                      // 約10個に凝縮したコア数字
  // エリア排除：直近10回で出すぎた10番台ごとのブロックを丸ごと外し、足りない分は点数の低い数字で10個に
  const blocks=[[1,9],[10,19],[20,29],[30,39],[40,43]];
  const bc=blocks.map(([a,b])=>{ let c=0; for(let k=r-10;k<r;k++){ const d=g.DRAWS.get(k); if(d) d.nums.forEach(x=>{ if(x>=a&&x<=b) c++; }); } return c/(b-a+1); });
  const bi=bc.indexOf(Math.max(...bc)); let drop=g.range.filter(n=>n>=blocks[bi][0]&&n<=blocks[bi][1]&&!core.slice(0,3).includes(n));
  if(drop.length>10) drop=drop.sort((a,b)=>score(a)-score(b)).slice(0,10);
  for(const n of ranked.slice().reverse()){ if(drop.length>=10) break; if(!drop.includes(n)&&!core.includes(n)) drop.push(n); }
  drop=sortN(drop);
  return {sweet,W:sortN([...W]),slide:[...slide],core,ranked,drop,block:blocks[bi],P,rng};
}
const FMT = {

  const seen=new Set(out.map(t=>t.join())); out.fb=out.fb||new Set();
  for(let i=out.length;i<n;i++){
    let t=null;
    for(let j=0;j<40;j++){ const c=gen(i); if(c&&!seen.has(c.join())){ t=c; break; } }
    if(!t){ do{ t=sortN(pickFrom(g.range,g.pick,rng)); }while(seen.has(t.join())); out.fb.add(i); }
    seen.add(t.join()); out.push(t);

    ()=>tryMake(()=>{ const k=1+Math.floor(rng()*2), keep=pickFrom(P,k,rng);
      let pool=g.range.filter(x=>!keep.includes(x)&&st.cnt[x]>=3&&st.cnt[x]<=4); if(pool.length<7-k) pool=g.range.filter(x=>!keep.includes(x)&&st.cnt[x]>=2);

    ()=>sortN(pickFrom(g.range,7,rng)),
    ()=>tryMake(()=>pickFrom(recent,5,rng).concat(pickFrom(cold,2,rng))),
    ()=>sortN(pickFrom(g.range,7,rng)),
    ()=>tryMake(()=>{ const keep=pickFrom(P,1,rng);
      let pool=g.range.filter(x=>!P.includes(x)&&st.cnt[x]<=2); if(pool.length<6) pool=g.range.filter(x=>!P.includes(x)&&st.cnt[x]<=3);

/* ---------- 過去で試す ---------- */
function genTicket(g, strat, r, rng, cond, fixed){
  if(strat==="fixed") return fixed;
  const prev=g.DRAWS.get(r-1), K=g.pick;
  let base;
  switch(strat){
    case "birthday": base={pool:g.range.slice(0,31)}; break;
    case "avoidPrev": base={pool:g.range.filter(n=>!prev.nums.includes(n))}; break;
    case "pullPrev1": base={pull:1}; break;
    case "pullPrev2": base={pull:2}; break;
    case "hot": case "cold": {
      const st=stats(g,r); const order=pickFrom(g.range,g.max,rng).sort((a,b)=>strat==="hot"?st.cnt[b]-st.cnt[a]:st.cnt[a]-st.cnt[b]);
      base={pool:order.slice(0,K*2)}; break; }
    default: base={pool:g.range};
  }
  for(let tries=0;tries<300;tries++){
    let t;
    if(base.pull){ t=pickFrom(prev.nums,base.pull,rng).concat(pickFrom(g.range.filter(n=>!prev.nums.includes(n)),K-base.pull,rng)); }
    else t=pickFrom(base.pool,K,rng);
    if(cond.consec&&!hasConsecLimit(t)) continue;
    if(cond.digit&&!hasDigitPair(t)) continue;
    if(cond.odd&&!isOddEven(t)) continue;
    return sortN(t);
  }
  return null;
}
const STRAT_NAME = s => $("strat").querySelector(`option[value="${s}"]`).textContent;
function minRoundFor(strat){ return strat==="hot"||strat==="cold"||strat==="admin" ? 25 : (strat==="avoidPrev"||strat.startsWith("pullPrev")) ? 2 : 1; }
function parseFixed(g){
  const s=[...new Set($("fixedNums").value.split(/[^0-9]+/).filter(Boolean).map(Number))];
  return (s.length===g.pick&&s.every(n=>n>=1&&n<=g.max)) ? sortN(s) : null;
}
function runTest(){
  const g=G(), strat=$("strat").value;
  const fixed = strat==="fixed" ? parseFixed(g) : null;
  if(strat==="fixed"&&!fixed){ toast(`1〜${g.max}の違う数字を${g.pick}個、カンマ区切りで入れてください`); return; }
  const cond={consec:$("cConsec").checked, digit:$("cDigit").checked, odd:$("cOdd").checked};
  if(strat==="fixed"||strat==="admin") cond.consec=cond.digit=cond.odd=false;
  const f=fmtOf(cg); let per=+$("perRound").value; if(strat==="admin"&&f.fixed) per=f.fixed;
  let seed=parseInt($("seed").value,10); if(!Number.isFinite(seed)){ seed=Math.floor(Math.random()*1e6); $("seed").value=seed; }
  const rng=mulberry32(seed);
  let from=minRoundFor(strat); const rv=$("range").value; if(rv!=="all") from=Math.max(from,g.LATEST-(+rv)+1);
  const counts={0:0}; g.tiers.forEach(k=>counts[k]=0); let tickets=0, skipped=0; const big=[];
  for(let r=from;r<=g.LATEST;r++){
    const d=g.DRAWS.get(r); if(!d) continue;
    const al = strat==="admin" ? adminLines(cg,r,f.id,per) : null;
    for(let k=0;k<per;k++){
      const t = al ? al[k] : genTicket(g,strat,r,rng,cond,fixed);
      if(!t){ skipped++; continue; }
      tickets++; const tier=judge(g,t,d); counts[tier]++;
      if(tier&&tier<=3&&big.length<20) big.push({r,t,tier});
    }
  }
  const spent=tickets*g.cost, back=g.tiers.reduce((a,k)=>a+counts[k]*g.prize[k],0);
  const condTxt=[cond.consec&&"連続は1組まで",cond.digit&&"下1桁ペアあり",cond.odd&&"奇数偶数を半分ずつ"].filter(Boolean).join("・");
  const name = strat==="admin" ? `管理人の予想：${f.name}` : STRAT_NAME(strat)+(fixed?`（${fixed.join(",")}）`:"");
  const rec={g:cg, at:Date.now(), strat, name, cond:condTxt, from, to:g.LATEST, per, seed, tickets, counts, spent, back};
  state.backtests.unshift(rec); state.backtests=state.backtests.slice(0,30); persist();

}

};
const AUTO_KEY=LS_KEY+"-auto";
function applyAuto(g,list){ let ch=false; for(const o of list){ if(validDraw(g,o)&&!g.BASE.has(o.round)&&!g.extraDb.has(o.round)){ g.extraDb.set(o.round,o); ch=true; } } if(ch) refreshDraws(g); return ch; }
function loadAutoCache(){ try{ const c=JSON.parse(localStorage.getItem(AUTO_KEY)||"{}"); for(const gid in c){ const g=GAMES[gid]; if(g) applyAuto(g,c[gid]); } }catch(e){} }
function saveAutoCache(){ try{ const c={}; for(const g of Object.values(GAMES)) c[g.id]=[...g.extraDb.values()]; localStorage.setItem(AUTO_KEY,JSON.stringify(c)); }catch(e){} }
async function syncCsv(){
  let changed=false;
  for(const g of Object.values(GAMES)){
    try{
      const [ta,tb]=await Promise.all(CSV_SRC[g.id].map(u=>fetch(u,{cache:"no-cache"}).then(r=>r.ok?r.text():"")));
      const B=new Map();
      for(const line of tb.split(/\r?\n/).slice(1)){ const c=line.split(","); if(c.length<13) continue;
        const nums=c.slice(4,4+g.pick).map(Number), bonus=c.slice(11,11+g.nb).map(Number); B.set(c[2],sortN(nums).join()+"|"+sortN(bonus).join()); }
      const add=[];
      for(const line of ta.split(/\r?\n/).slice(1)){ const c=line.split(","); const round=parseInt(c[0],10);
        if(!(round>g.LATEST)) continue;
        const date=(c[1]||"").replace(/\//g,"-"), nums=sortN(c.slice(2,2+g.pick).map(Number)), bonus=sortN(c.slice(2+g.pick,2+g.pick+g.nb).map(Number));
        if(B.get(date)!==nums.join()+"|"+bonus.join()) continue;   // 2つのデータが一致した回だけ使う
        add.push({round,date,nums,bonus,src:"auto"}); }
      add.sort((a,b)=>a.round-b.round);
      if(applyAuto(g,add)) changed=true;
    }catch(e){}
  }
  if(changed){ saveAutoCache(); settle(); renderAll(); }
}
function saveLocalDraws(){ try{ const all=[]; for(const g of Object.values(GAMES)) for(const o of g.extraLocal.values()) all.push({...o,g:g.id}); localStorage.setItem(LS_KEY+"-draws",JSON.stringify(all)); }catch(e){} }
function loadLocalDraws(){ try{ for(const o of JSON.parse(localStorage.getItem(LS_KEY+"-draws")||"[]")){ const g=GAMES[o.g||"6"]; const b=Array.isArray(o.bonus)?o.bonus:[o.bonus]; const x={round:o.round,date:o.date,nums:o.nums,bonus:b,src:"local"}; if(validDraw(g,x)) g.extraLocal.set(x.round,x); } }catch(e){} }

/* ---------- 全体 ---------- */
function renderAll(){ renderHeader(); renderPick(); renderAdmin(); renderTestForm(); renderStats(); renderResults(); }
function showView(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll(".tab").forEach(t=>{ const on=t.dataset.v===v; t.classList.toggle("on",on); t.setAttribute("aria-current",on?"page":"false"); });
  window.scrollTo(0,0);
  if(location.hash.slice(1)!==v) history.replaceState(null,"","#"+v);
}
function switchGame(gid){
  if(gid===cg||!GAMES[gid]) return;
  cg=gid; try{ localStorage.setItem(LS_KEY+"-game",cg); }catch(e){}
  lines=emptyLines(); cur=0; adminShowAll=false; findR=null; listShown=30; $("findRound").value="";
  $("testOut").innerHTML=`<p class="empty">選び方を決めて「この選び方で試す」を押すと、何等が何回出たかがここに出ます。</p>`;
  buildGrid(); buildManual(); renderAll();
}

function init(){
  loadLocal(); loadLocalDraws(); Object.values(GAMES).forEach(refreshDraws);
  try{ const s=localStorage.getItem(LS_KEY+"-game"); if(GAMES[s]) cg=s; }catch(e){}
  buildGrid(); buildManual();
  $("seed").value=Math.floor(Math.random()*1e6);
  document.querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>switchGame(b.dataset.g));
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>showView(t.dataset.v));
  const h=location.hash.slice(1); if(["pick","test","stats","res"].includes(h)) showView(h);
  window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(["pick","test","stats","res"].includes(h)) showView(h); });
  $("btnAdmin").onclick=()=>{ const g=G(), f=fmtOf(cg), ls=adminLines(cg,nextRound(g),f.id,f.fixed||adminN[cg]); lines=emptyLines(); ls.slice(0,SLOTS).forEach((t,i)=>{ lines[i]={nums:t.slice(),rand:new Set()}; }); cur=0; renderPick(); $("lines").scrollIntoView({behavior:"smooth",block:"start"}); toast(`管理人の予想${ls.length}口を${lab(0)}〜${lab(ls.length-1)}枠に入れました`); };
  const reAdmin=()=>{ adminShowAll=false; $("adminRecord").textContent="計算中…"; setTimeout(()=>{ renderAdmin(); renderTestForm(); },20); };
  $("adminFmt").onchange=()=>{ adminFmt[cg]=$("adminFmt").value; reAdmin(); };
  $("adminCount").onchange=()=>{ adminN[cg]=+$("adminCount").value; reAdmin(); };
  $("btnClear").onclick=()=>{ lines[cur]={nums:[],rand:new Set()}; renderPick(); };
  $("btnRand").onclick=()=>fillRandom(false);
  $("btnQuick").onclick=()=>fillRandom(true);
  $("prevLine").onclick=()=>{ if(cur>0){ cur--; renderPick(); } };
  $("nextLineBtn").onclick=()=>{ if(cur<SLOTS-1){ cur++; renderPick(); } };
  $("btnBuy").onclick=()=>{
    const g=G(), ls=filled(), cost=ls.length*g.cost;
    if(!ls.length||state.points<cost) return;
    const r=nextRound(g);
    ls.forEach((l,i)=>state.tickets.push({id:Date.now().toString(36)+i+Math.random().toString(36).slice(2,6), g:cg, round:r, nums:sortN(l.nums), at:Date.now()+i, settled:false, tier:null, win:0}));
    state.points-=cost; lines=emptyLines(); cur=0; persist(); renderAll();
    toast(`${g.name} 第${r}回に${ls.length}口登録しました。抽せんのあと自動で答え合わせします`);
  };
  $("btnRefill").onclick=()=>{ const minCost=Math.min(...Object.values(GAMES).map(x=>x.cost)); if(state.points>=minCost) return; state.points+=START_PTS; state.refills++; persist(); renderAll(); toast(`${START_PTS.toLocaleString()}ptを補充しました`); };
  $("strat").onchange=()=>{ const v=$("strat").value, f=v==="fixed"||v==="admin"; $("fixedBox").style.display=v==="fixed"?"":"none"; $("condBox").style.opacity=f?.4:1; $("condBox").querySelectorAll("input").forEach(i=>i.disabled=f); };
  $("btnRun").onclick=()=>{ $("btnRun").disabled=true; $("btnRun").textContent="計算中…"; setTimeout(()=>{ try{ runTest(); } finally { $("btnRun").disabled=false; $("btnRun").textContent="この選び方で試す"; } },30); };
  $("btnManual").onclick=saveManual;
  $("btnMore").onclick=()=>{ listShown+=50; renderResults(); };
  $("findRound").oninput=()=>{ const v=parseInt($("findRound").value,10); findR=v>=1?v:null; renderResults(); };
  settle(); renderAll();
  loadAutoCache(); settle(); renderAll(); syncCsv();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) syncCsv(); });
}

async function connectDb(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  try{
    db=await window.claude.use("db");
    const user=await window.claude.use("user");
    if(!db) return;
    try{ const own=user&&typeof user.isOwner==="function"?await user.isOwner():null; canWriteShared=own!==false; }catch(e){ canWriteShared=true; }
    for(const g of Object.values(GAMES)){
      db.collection(g.col).onSnapshot(snap=>{
        const m=new Map();
        for(const d of snap.docs){ const x=d.data(); if(!x) continue;
          const o={round:x.round,date:x.date,nums:Array.isArray(x.nums)?sortN(x.nums):[],bonus:Array.isArray(x.bonus)?sortN(x.bonus):[x.bonus],src:x.source==="manual"?"manual":"auto"};
          if(validDraw(g,o)) m.set(o.round,o); }
        g.extraDb=m; refreshDraws(g); settle(); renderAll();
      },()=>{});
    }
    uid=user?await user.id():null;
    if(!uid) return;
    stateRef=db.doc("data/users/"+uid+"/state");
    const snap=await stateRef.get();
    let push=!snap.exists;
    if(snap.exists){
      try{ const s=JSON.parse(snap.data().json); if(s&&s.v===1){
        const localNewer=(state.tickets.length+state.backtests.length)>(s.tickets.length+s.backtests.length);
        if(localNewer) push=true; else { state=s; if(upgradePts()) push=true; }
      } }catch(e){}
    }
    canSaveDb=true; saveLocal(); settle(); renderAll();
    if(push){ dirty=true; flush(); }
  }catch(e){}
}
init();
</script>
